name: Release on Tag

on:
  push:
    tags:
      - 'inertia-v*'  # Inertia releases: inertia-v0.1.0

jobs:
  release:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    permissions:
      contents: read        # actions/checkout needs repo read access
      id-token: write       # for OIDC (trusted publishing)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#inertia-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Releasing Sillo Inertia v$VERSION"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # The install script has moved between ~/.cargo/bin and ~/.local/bin
      # across uv versions. Add both so the PATH does not depend on which
      # installer layout ships today.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clean Old Builds
        run: rm -rf dist build *.egg-info

      - name: Setup Virtual Environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Build the package
        run: uv build

      # Prefers OIDC trusted publishing (the id-token permission above); falls
      # back to an API token when the PYPI_TOKEN secret is set. Passing an empty
      # --token is a hard failure, so the secret must not be forwarded blindly.
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            uv publish --token "$PYPI_TOKEN"
          else
            uv publish
          fi
