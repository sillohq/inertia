[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo-inertia"
version = "0.1.0"
description = "Inertia.js adapter for Sillo with React/Vite support."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
keywords = ["sillo", "inertia", "react", "vite", "asgi"]
dependencies = [
    "sillo>=0.0.1a1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
]

[tool.hatch.build.targets.wheel]
packages = ["sillo_inertia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"
