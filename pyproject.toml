[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo-inertia"
version = "1.0.0a2"
description = "Inertia.js adapter for Sillo with React/Vue/Vite support."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
keywords = ["sillo", "inertia", "react", "vue", "vite", "asgi", "spa"]
dependencies = [
    # [record] is not optional here: `import sillo` reaches sillo.users.base,
    # which imports tortoise at module scope. A bare sillo-framework install
    # makes `import sillo_inertia` fail with ModuleNotFoundError: 'tortoise'.
    #
    # The floor is 0.3.2 because that is the first release carrying the v1
    # context rewrite. `Request` and the `Responder` builder are gone there,
    # and this adapter is written against `HttpContext` and the free response
    # builders in `sillo.responses` — on anything older it fails at import,
    # not at request time.
    "sillo-framework[record]>=1.0.0a1",
]

[project.urls]
Homepage = "https://github.com/sillohq/inertia"
Repository = "https://github.com/sillohq/inertia"
Documentation = "https://docs.sillo.build"
Issues = "https://github.com/sillohq/inertia/issues"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=5.0.0",
    # CI ran `mypy` and `ruff` without either being installed here, so both
    # steps failed to start and were swallowed by their `|| true`. Neither
    # check had ever actually run.
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["sillo_inertia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
files = ["sillo_inertia"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "tests",
    "test",
]

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["F401"]
"tests/*" = ["F401"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0a2"
version_files = [
    "pyproject.toml:version"
]
tag_format = "v$version"
update_changelog_on_bump = true
